# SiraLite Shaders - block ids handed to the shaders as mc_Entity.x
#
# 10001  vegetation anchored at its base (grass, flowers, crops, underwater plants)
# 10002  leaves, which sway gently as a whole block
# 10003  water, which gets the water-only surface treatment and surface motion
#
# Names are Minecraft 1.21.5 block ids without the minecraft: namespace.
# A block that is not listed here gets no id from this file and therefore
# never moves; nothing breaks if a name below does not exist in your version.

block.10001=short_grass tall_grass fern large_fern dead_bush dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley torchflower sunflower lilac rose_bush peony wheat carrots potatoes beetroots sweet_berry_bush seagrass kelp tall_seagrass crimson_roots warped_roots nether_sprouts big_dripleaf small_dripleaf sugar_cane pitcher_plant

block.10002=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves cherry_leaves azalea_leaves flowering_azalea_leaves pale_oak_leaves vine

block.10003=water bubble_column
