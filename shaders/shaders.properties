# SiraLite Shaders - Iris configuration
#
# Options themselves are declared in shaders/lib/settings.glsl.
# This file only decides how they are shown, plus the three profiles.

# ---------------------------------------------------------------- screens
screen = <empty> <profile> <empty> [PERFORMANCE] [LIGHTING] [ATMOSPHERE] [VEGETATION] [WATER] [SHADOWS] [POST] *
screen.PERFORMANCE = POST_PROCESSING
screen.LIGHTING = EXPOSURE SATURATION CONTRAST SUNSET_STRENGTH NIGHT_BRIGHTNESS
screen.ATMOSPHERE = FOG_DENSITY CLOUD_SHADING SKY_CIRRUS SUN_GLARE
screen.VEGETATION = WAVING_PLANTS WAVING_WATER WAVE_STRENGTH VEGETATION_POLISH
screen.WATER = WATER_REFLECTIONS WATER_REFLECTION_STRENGTH WATER_WAVES WATER_DEPTH UNDERWATER_CAUSTICS
screen.SHADOWS = SHADOW_QUALITY shadowMapResolution shadowDistance SHADOW_STRENGTH
screen.POST = BLOOM VIGNETTE SSAO

sliders = EXPOSURE SATURATION CONTRAST SUNSET_STRENGTH NIGHT_BRIGHTNESS FOG_DENSITY WATER_REFLECTION_STRENGTH SHADOW_STRENGTH WAVE_STRENGTH

# --------------------------------------------------------------- profiles
# Ultra Performance is the default: these values are the defaults in
# settings.glsl, so a fresh install already runs this profile.
profile.SIRALITE_ULTRA = POST_PROCESSING WAVING_PLANTS WAVING_WATER WAVE_STRENGTH:1.0 VEGETATION_POLISH CLOUD_SHADING SKY_CIRRUS SUN_GLARE WATER_DEPTH UNDERWATER_CAUSTICS SHADOW_QUALITY:0 SHADOW_STRENGTH:0.75 WATER_REFLECTIONS WATER_REFLECTION_STRENGTH:0.15 !WATER_WAVES FOG_DENSITY:1.0 EXPOSURE:1.0 SATURATION:1.08 CONTRAST:1.05 SUNSET_STRENGTH:1.0 NIGHT_BRIGHTNESS:1.0 !BLOOM !VIGNETTE !SSAO

profile.SIRALITE_BALANCED = POST_PROCESSING WAVING_PLANTS WAVING_WATER WAVE_STRENGTH:1.0 VEGETATION_POLISH CLOUD_SHADING SKY_CIRRUS SUN_GLARE WATER_DEPTH UNDERWATER_CAUSTICS SHADOW_QUALITY:1 SHADOW_STRENGTH:0.7 WATER_REFLECTIONS WATER_REFLECTION_STRENGTH:0.35 WATER_WAVES FOG_DENSITY:1.0 EXPOSURE:1.0 SATURATION:1.10 CONTRAST:1.05 SUNSET_STRENGTH:1.1 NIGHT_BRIGHTNESS:1.0 !BLOOM VIGNETTE !SSAO

profile.SIRALITE_VISUAL = POST_PROCESSING WAVING_PLANTS WAVING_WATER WAVE_STRENGTH:1.25 VEGETATION_POLISH CLOUD_SHADING SKY_CIRRUS SUN_GLARE WATER_DEPTH UNDERWATER_CAUSTICS SHADOW_QUALITY:2 SHADOW_STRENGTH:0.65 WATER_REFLECTIONS WATER_REFLECTION_STRENGTH:0.5 WATER_WAVES FOG_DENSITY:0.9 EXPOSURE:1.02 SATURATION:1.12 CONTRAST:1.08 SUNSET_STRENGTH:1.2 NIGHT_BRIGHTNESS:1.05 BLOOM VIGNETTE !SSAO

# ------------------------------------------------------------- behaviour
# The post pass is skipped entirely when POST_PROCESSING is off, which is the
# cheapest way to shed a full-screen pass on very weak hardware.
program.composite.enabled = POST_PROCESSING

# Translucent geometry in the shadow pass is water, glass and ice: it should
# never cast solid shadows, and rendering it there is wasted work.
shadowTranslucent = false

# The pack draws its own underwater tint and its own optional vignette.
underwaterOverlay = false
vignette = false
