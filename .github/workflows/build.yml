name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shaderpack:
    name: Check sources and package the shader pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Structural shader checks
        run: bash tools/check_shaders.sh

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Package shader pack
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assemble

      - name: Show the produced zip
        run: ls -l build/releases

      - name: Upload shader pack
        uses: actions/upload-artifact@v4
        with:
          name: siralite-shaders
          path: build/releases/*.zip
          if-no-files-found: error
